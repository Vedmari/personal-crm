# Every pull request into main is checked before it can be merged:
# lint, format, types, Vitest, Playwright and the app image build.
# The three jobs run in parallel; branch protection on main requires all of
# them to be green ("Checks", "E2E", "Image"), so a red PR cannot be merged.
# The image is only built here, not pushed: deploy.yml builds and pushes it
# after the merge.
name: CI

on:
  pull_request:
    branches: [main]

# A new push to the same PR cancels the run for the previous commit.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

# The tests derive their own databases from this address (`crm_test`,
# `crm_e2e_test`) and create them in the PostgreSQL service below.
env:
  DATABASE_URL: postgresql://crm:crm@localhost:5432/crm
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Types
        run: pnpm typecheck

      - name: Unit and database tests
        run: pnpm test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Google Chrome is preinstalled on the GitHub runner (playwright.config.ts
      # uses channel "chrome"), so no browser is downloaded.
      - name: Browser tests
        run: pnpm test:e2e

      # Screenshot and trace of a failed test, to open with
      # `pnpm exec playwright show-trace`.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  image:
    name: Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Same cache as deploy.yml, so the build after the merge reuses the layers.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
