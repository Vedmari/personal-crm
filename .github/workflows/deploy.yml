name: Deploy staging

on:
  push:
    branches: [main]

# One run at a time: a newer push does not interrupt the running deploy.
# GitHub keeps one pending run; a newer push may replace that pending run.
# deploy/deploy.sh also locks its environment on the server.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Image names must be lowercase, the GitHub account name is not.
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for an existing release image
        id: published
        run: bash deploy/check-image.sh "${{ steps.image.outputs.name }}"

      - uses: docker/build-push-action@v7
        if: steps.published.outputs.exists == 'false'
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Every deploy to the test stand is recorded in GitHub (Deployments, "staging").
    environment:
      name: staging
      url: https://test-app.lichnaya-crm.ru
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: bash deploy/setup-ssh.sh

      - name: Deploy on the server
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: bash deploy/run-release.sh staging
