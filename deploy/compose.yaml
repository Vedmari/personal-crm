# The app stack on the server, one file for both environments:
#   production   - compose project "prod" in /opt/crm/prod
#   the test stand - compose project "staging" in /opt/crm/staging
# Each project has its own containers, database volume, .env and port.
# Started only by the scripts in deploy/ (lib.sh, `compose`), which pass:
#   - <folder>/.env       - secrets and settings of the environment, mode 600:
#       POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB - the database;
#       BETTER_AUTH_SECRET, BETTER_AUTH_URL           - the sign-in;
#       SMTP_URL                                      - where sign-in emails go (Resend);
#       OWNER_EMAIL                                   - the owner of the data that was
#                                                       there before the sign-in
#   - IMAGE, IMAGE_TAG    - the app image and its version (git commit SHA)
#   - APP_PORT            - the port of the app on 127.0.0.1: 3000 production, 3001 the test stand
# A setting that is not there stops the deploy at its first step
# (`compose config`), before the backup and the migrations.
# Local development uses docker-compose.yml in the repository root instead.
#
# Memory limits: the server has 2 GB for both environments and the landing
# page. A container that goes over its limit is stopped and started again
# (restart: unless-stopped), and the other containers are not affected.

x-database-url: &database-url
  DATABASE_URL: "postgresql://${POSTGRES_USER:?Set POSTGRES_USER in the .env of this environment}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env of this environment}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in the .env of this environment}"

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No published port: only containers of this project reach the database.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: journald
      options:
        tag: "crm-${COMPOSE_PROJECT_NAME}-postgres"

  # One-off step: applies migrations and exits. Never started by `up`.
  # Also runs the test data generator (deploy/seed.sh).
  migrate:
    image: ${IMAGE:?IMAGE is set by the deploy script}:${IMAGE_TAG:?IMAGE_TAG is set by the deploy script}
    command: ["node", "scripts/migrate.mts"]
    environment:
      <<: *database-url
      # The contacts, notes and groups that are already in the database, and
      # the test data, go to the user with this email.
      OWNER_EMAIL: ${OWNER_EMAIL:?Set OWNER_EMAIL in the .env of this environment}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    profiles: ["tools"]
    logging:
      driver: journald
      options:
        tag: "crm-${COMPOSE_PROJECT_NAME}-migrate"

  app:
    image: ${IMAGE}:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      <<: *database-url
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in the .env of this environment}
      # The address of this environment: the links in the letters lead here,
      # so a sign-in asked for on the test stand ends on the test stand.
      # https://app.lichnaya-crm.ru production, https://test-app.lichnaya-crm.ru the test stand.
      # The sign-in cookie has no domain: it stays on this address only.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in the .env of this environment}
      SMTP_URL: ${SMTP_URL:?Set SMTP_URL in the .env of this environment}
    ports:
      # Only nginx on the same server can reach the app.
      - "127.0.0.1:${APP_PORT:?APP_PORT is set by the deploy script}:3000"
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: journald
      options:
        tag: "crm-${COMPOSE_PROJECT_NAME}-app"

volumes:
  postgres_data:
