# Production stack on the server: compose project "prod" in /opt/crm/prod.
# Started only by deploy/deploy.sh and deploy/rollback.sh, which pass:
#   - /opt/crm/prod/.env  - POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB (secrets, mode 600)
#   - IMAGE, IMAGE_TAG    - the app image and its version (git commit SHA)
# Local development uses docker-compose.yml in the repository root instead.

x-logging:
  &logging # Container logs are capped at 3 files of 10 MB so they cannot fill the disk.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-database-url: &database-url
  DATABASE_URL: "postgresql://${POSTGRES_USER:?Set POSTGRES_USER in /opt/crm/prod/.env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in /opt/crm/prod/.env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in /opt/crm/prod/.env}"

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No published port: only containers of this project reach the database.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  # One-off step: applies migrations and exits. Never started by `up`.
  migrate:
    image: ${IMAGE:?IMAGE is set by the deploy script}:${IMAGE_TAG:?IMAGE_TAG is set by the deploy script}
    command: ["node", "scripts/migrate.mts"]
    environment: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]
    logging: *logging

  app:
    image: ${IMAGE}:${IMAGE_TAG}
    restart: unless-stopped
    environment: *database-url
    ports:
      # Only nginx on the same server can reach the app.
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

volumes:
  postgres_data:
